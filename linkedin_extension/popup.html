<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Message Tracker - System Prompt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 300px;
      background-color: #1e293b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      resize: vertical;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #64748b;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    .button-container {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    button:active {
      background-color: #1d4ed8;
    }

    #status {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      border-radius: 4px;
      color: #22c55e;
      font-size: 13px;
      text-align: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <h1>System Prompt</h1>
  <p class="subtitle">This prompt controls how the AI replies to LinkedIn messages.</p>

  <textarea
    id="promptInput"
    rows="8"
    placeholder="e.g. You are a professional LinkedIn assistant. Reply briefly and warmly..."
  ></textarea>

  <div class="button-container">
    <button id="saveBtn">Save Prompt</button>
  </div>

  <p id="status">Saved successfully</p>

  <script src="popup.js"></script>
</body>
</html>
