<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { width: 380px; min-height: 200px; background: #f3f2ee; }

    .header { background: #0a66c2; color: white; padding: 16px 18px; font-size: 16px; font-weight: 600; }

    .content { padding: 24px 18px; text-align: center; }

    .info-text { color: #555; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }

    .admin-btn { 
      background: #0a66c2; 
      color: white; 
      border: none;
      padding: 12px 24px; 
      border-radius: 6px; 
      font-size: 14px; 
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .admin-btn:hover { background: #004182; }

    .footer { 
      color: #888; 
      font-size: 11px; 
      padding: 12px 18px; 
      border-top: 1px solid #ddd;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">LinkedIn AI Assistant</div>

  <div class="content">
    <p class="info-text">
      Manage your AI prompts and view chat history in the admin portal.
    </p>
    <button class="admin-btn" id="openAdmin">Open Admin Panel</button>
  </div>

  <div class="footer">
    Admin portal: localhost:9011/admin
  </div>

  <script src="popup.js"></script>
</body>
</html>
