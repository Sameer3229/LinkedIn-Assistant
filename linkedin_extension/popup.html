<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* General reset */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { width: 460px; min-height: 500px; background: #f3f2ee; }

    /* Header */
    .header { background: #0a66c2; color: white; padding: 14px 18px; font-size: 16px; font-weight: 600; }

    /* Tab bar */
    .tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
           cursor: pointer; color: #666; border-bottom: 3px solid transparent; }
    .tab.active { color: #0a66c2; border-bottom: 3px solid #0a66c2; }

    /* Tab content panels */
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }

    /* Prompt Manager tab */
    .prompt-label { font-size: 12px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
    .prompt-textarea { width: 100%; height: 220px; border: 1px solid #ccc; border-radius: 6px;
                       padding: 10px; font-size: 13px; resize: vertical; line-height: 1.5; }
    .save-btn { margin-top: 10px; background: #0a66c2; color: white; border: none;
                padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600;
                cursor: pointer; width: 100%; }
    .save-btn:hover { background: #004182; }
    .status-msg { margin-top: 8px; color: #057642; font-size: 13px; text-align: center;
                  display: none; font-weight: 600; }
    .prompt-hint { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.4; }

    /* Chat History tab */
    .chat-list { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
    .chat-card { background: white; border-radius: 8px; padding: 12px 14px; border: 1px solid #e0e0e0;
                 display: flex; align-items: flex-start; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #0a66c2; color: white;
              display: flex; align-items: center; justify-content: center; font-weight: 700;
              font-size: 15px; flex-shrink: 0; }
    .chat-meta { flex: 1; min-width: 0; }
    .chat-name { font-weight: 700; font-size: 13px; color: #1a1a1a; }
    .chat-time { font-size: 11px; color: #888; margin-left: 6px; }
    .chat-preview { font-size: 12px; color: #555; margin-top: 4px; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; }
    .chat-reply { font-size: 12px; color: #0a66c2; margin-top: 3px; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
    .reply-label { font-size: 10px; font-weight: 700; color: #057642; text-transform: uppercase;
                   letter-spacing: 0.5px; }
    .empty-state { text-align: center; color: #888; font-size: 13px; padding: 40px 0; }
    .clear-btn { font-size: 11px; color: #cc0000; background: none; border: none;
                 cursor: pointer; margin-top: 10px; display: block; text-align: right;
                 margin-left: auto; }
  </style>
</head>
<body>
  <div class="header">LinkedIn AI Assistant</div>

  <div class="tabs">
    <div class="tab active" id="tab-prompt">Prompt Manager</div>
    <div class="tab" id="tab-history">Chat History</div>
  </div>

  <div class="panel active" id="panel-prompt">
    <label class="prompt-label">System Prompt</label>
    <textarea class="prompt-textarea" id="promptInput"
      placeholder="Describe yourself: e.g. You are replying on behalf of John, a cricket coach specializing in batting technique and franchise cricket strategy. Keep replies short and professional."></textarea>
    <p class="prompt-hint">
      Tip: Include your name, profession, and key topics you handle.
      The AI will only use what you write here — it will not guess or invent details.
    </p>
    <button class="save-btn" id="saveBtn">Save Prompt</button>
    <div class="status-msg" id="status">Prompt saved!</div>
  </div>

  <div class="panel" id="panel-history">
    <div class="chat-list" id="chatList">
      <div class="empty-state">No conversations replied to yet.</div>
    </div>
    <button class="clear-btn" id="clearHistory">Clear history</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
